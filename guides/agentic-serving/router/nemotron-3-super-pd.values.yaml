## agentic-serving (GPU / P/D-disaggregated) guide overrides for the llm-d router.
## Layer on top of: recipes/router/base.values.yaml
##
## Disagg-aware: separate prefill and decode scheduling profiles. inferencePool.create
## is set to false because the InferencePool CRD cannot be created on all clusters (no
## cluster-wide CRD-install permission); upstream's own guides assume the GAIE CRDs are
## installed cluster-wide instead (see the guide doc's GAIE CRD prerequisite step) and
## don't set this override themselves.

router:
  inferencePool:
    create: false

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    pluginsConfigFile: "nemotron-3-super-pd-plugins.yaml"
    pluginsCustomConfig:
      nemotron-3-super-pd-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: disagg-headers-handler
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciderPluginName: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            autoTune: false
            lruCapacityPerServer: 2000000
        - type: active-request-scorer
        - type: token-load-scorer
        - type: prefix-cache-affinity-filter
          parameters:
            # Measured via recipes/router/calibration/calibrate.sh against a
            # live nemotron-3-super-pd deployment (H100, TP=4,
            # --max-num-batched-tokens=8192, the vLLM default). Re-measure if
            # TP, chunk size, quantization, or --max-model-len change.
            peakPrefillThroughput: 19169
        - type: inflight-load-producer
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: token-load-scorer
          - pluginRef: prefix-cache-affinity-filter
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer

  modelServers:
    matchLabels:
      llm-d.ai/guide: "nemotron-3-super-pd"