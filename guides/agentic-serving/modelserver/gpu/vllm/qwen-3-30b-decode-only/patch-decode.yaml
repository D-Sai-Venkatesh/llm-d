apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  # A fresh pod must pull the image and download ~60GB of weights before it can
  # answer a probe. The default 600s can run out before that finishes, and then
  # create.sh (in llm-d-agentic-benchmarking-scripts) reports the rollout as
  # failed when nothing is actually wrong.
  progressDeadlineSeconds: 2400
  template:
    spec:
      # Do not schedule on the node pokprod-b93r39s2 — it was producing bad runs.
      # Delete this whole affinity block when running on any other cluster.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - pokprod-b93r39s2
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3-30B-A3B-Instruct-2507"
            - "--served-model-name"
            - "Qwen/Qwen3-30B-A3B-Instruct-2507"
            - "--seed=42"
            - "--trust-remote-code"
            - "--tensor-parallel-size=2"
            - "--max-model-len=262144"
            - "--max-num-seqs=128"
            - "--enable-chunked-prefill"
            - "--enable-prefix-caching"
            - "--kv-cache-dtype=fp8"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=qwen3_coder"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          env:
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              # Keep this above 90s. The routing sidecar drops an idle connection
              # at 90s. If vLLM drops it first instead, the sidecar tries to reuse
              # a dead socket and the request fails with a TCP reset.
              # Full story: llm-d-benchmark PR #1675.
              value: "120"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          resources:
            limits:
              cpu: "64"
              memory: 512Gi
              nvidia.com/gpu: "2"
            requests:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "2"
          volumeMounts:
            # Shared memory, used by the 2 tensor-parallel worker processes to talk
            # to each other. A container gets only 64MB of it by default, which is
            # far too small and shows up as a crash during model load.
            - mountPath: /dev/shm
              name: shm
            # The four mounts below are all the same trick. OpenShift runs this
            # container as a random non-root user, so it cannot create files at the
            # top of the filesystem. Each of these libraries wants to cache into a
            # folder there, and crashes at startup if it cannot:
            #   /.cache         torch compile cache
            #   /.config        vLLM's own config dir
            #   /.triton        triton kernel cache
            #   /.tensorrt_llm  flashinfer allreduce backend
            # An empty scratch volume at each path makes those writes succeed.
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.config
              name: vllm-config
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.tensorrt_llm
              name: tensorrt-llm-cache
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            # Keep these three numbers identical to readinessProbe below. If
            # readiness gives up first, the router removes the pod from its list of
            # endpoints while the pod is still alive, and requests fail with
            # "no endpoint candidates". Full story: llm-d-benchmark PR #1734.
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 10
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 10
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: tensorrt-llm-cache
          emptyDir: {}
